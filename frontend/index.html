<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WildCast &mdash; Daily Wildlife Encounter Forecasts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #898781;
    --gridline: #e1e0d9;
    --baseline: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --seq-100: #cde2fb;
    --seq-400: #3987e5;
    --seq-500: #256abf;
    --seq-650: #104281;
    --status-good: #0ca30c;
    --status-warning: #fab219;
    --status-serious: #ec835a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #898781;
      --gridline: #2c2c2a;
      --baseline: #383835;
      --border: rgba(255,255,255,0.10);
      --seq-100: #16324f;
      --seq-400: #3987e5;
      --seq-500: #5598e7;
      --seq-650: #86b6ef;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  header {
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  header p { margin: 0; color: var(--text-secondary); font-size: 14px; }
  .layout {
    display: grid;
    grid-template-columns: minmax(280px, 1fr) minmax(320px, 420px);
    gap: 16px;
    padding: 16px;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 780px) {
    .layout { grid-template-columns: 1fr; }
  }
  #map {
    height: 460px;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .panel {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .controls label { font-size: 13px; color: var(--text-secondary); }
  .controls input[type="date"], .controls select {
    font: inherit;
    padding: 6px 8px;
    border-radius: 6px;
    border: 1px solid var(--baseline);
    background: var(--surface-1);
    color: var(--text-primary);
  }
  .area-name { font-size: 15px; font-weight: 600; margin: 0 0 2px; }
  .area-meta { font-size: 12px; color: var(--text-muted); margin: 0 0 12px; }
  .species-row {
    padding: 10px 0;
    border-top: 1px solid var(--gridline);
    cursor: pointer;
  }
  .species-row:first-of-type { border-top: none; }
  .species-row .top-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .species-row .name { font-size: 14px; font-weight: 600; }
  .species-row .sci { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .species-row .pct { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar-track {
    height: 6px;
    border-radius: 4px;
    background: var(--gridline);
    margin-top: 6px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: var(--seq-400);
    border-radius: 4px;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    margin-top: 6px;
  }
  .badge.high { color: var(--status-good); }
  .badge.medium { color: #9a6a00; }
  .badge.low { color: #b5502a; }
  .badge::before { content: "\25CF"; font-size: 8px; }
  .factors { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .factors li { font-size: 12px; color: var(--text-secondary); line-height: 1.4; padding-left: 12px; position: relative; }
  .factors li::before { content: "\2013"; position: absolute; left: 0; color: var(--text-muted); }
  .window-chart { margin-top: 10px; display: none; }
  .window-chart.open { display: block; }
  .window-chart svg { width: 100%; height: 140px; display: block; }
  .window-chart .axis-label { font-size: 10px; fill: var(--text-muted); }
  .window-chart .line { fill: none; stroke: var(--seq-500); stroke-width: 2; }
  .window-chart .grid { stroke: var(--gridline); stroke-width: 1; }
  .hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .empty-state { color: var(--text-muted); font-size: 14px; padding: 30px 4px; text-align: center; }
  .api-config { font-size: 11px; color: var(--text-muted); margin-top: 14px; }
  .api-config input { font: inherit; font-size: 11px; width: 100%; padding: 4px 6px; border-radius: 5px; border: 1px solid var(--baseline); background: var(--surface-1); color: var(--text-secondary); margin-top: 3px; }
</style>
</head>
<body>

<header>
  <h1>WildCast</h1>
  <p>Daily probability of a wildlife encounter, by place and date &mdash; a weather forecast for the wild.</p>
</header>

<div class="layout">
  <div>
    <div id="map"></div>
  </div>

  <div class="panel">
    <div class="controls">
      <div>
        <label for="area-select">Area</label><br />
        <select id="area-select"><option value="">Loading areas&hellip;</option></select>
      </div>
      <div>
        <label for="date-input">Date</label><br />
        <input type="date" id="date-input" />
      </div>
    </div>

    <div id="results">
      <div class="empty-state">Pick a pilot area (on the map or the dropdown above) to see its forecast.</div>
    </div>

    <div class="api-config">
      API base URL (edit if your backend runs elsewhere)
      <input id="api-base" value="http://localhost:8000" />
    </div>
  </div>
</div>

<script>
  const state = { areaId: null, areas: [] };
  const AREA_TYPE_LABELS = {
    urban: "Urban green space",
    national_park: "National park",
    arctic_tundra: "Arctic tundra",
    rainforest: "Rainforest",
  };

  const dateInput = document.getElementById("date-input");
  const today = new Date().toISOString().slice(0, 10);
  dateInput.value = today;

  function apiBase() {
    return document.getElementById("api-base").value.replace(/\/$/, "");
  }

  // Map creation is guarded: if the Leaflet CDN can't be reached (offline
  // dev box, restrictive corporate proxy), the rest of the app -- area
  // selection via the dropdown, predictions, the best-window chart -- still
  // works. A broken map must never take down the whole page.
  let map = null;
  try {
    if (typeof L === "undefined") throw new Error("Leaflet failed to load from the CDN");
    map = L.map("map").setView([15, 20], 2);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: "&copy; OpenStreetMap contributors",
      maxZoom: 12,
    }).addTo(map);
  } catch (err) {
    console.warn("Map unavailable, falling back to the area dropdown only:", err);
    const mapEl = document.getElementById("map");
    if (mapEl) {
      mapEl.style.display = "flex";
      mapEl.style.alignItems = "center";
      mapEl.style.justifyContent = "center";
      mapEl.style.color = "var(--text-muted)";
      mapEl.style.fontSize = "13px";
      mapEl.style.textAlign = "center";
      mapEl.style.padding = "16px";
      mapEl.textContent = "Map tiles unavailable right now -- use the Area dropdown instead.";
    }
  }

  const markers = {};
  const areaSelect = document.getElementById("area-select");

  async function loadAreas() {
    try {
      const res = await fetch(`${apiBase()}/api/areas`);
      const areas = await res.json();
      state.areas = areas;

      areaSelect.innerHTML =
        `<option value="">Choose an area&hellip;</option>` +
        areas.map((a) => `<option value="${a.id}">${a.name}</option>`).join("");

      if (map) {
        areas.forEach((area) => {
          const marker = L.circleMarker([area.lat, area.lon], {
            radius: 9,
            color: "#256abf",
            fillColor: "#3987e5",
            fillOpacity: 0.85,
            weight: 2,
          }).addTo(map);
          marker.bindTooltip(area.name);
          marker.on("click", () => selectArea(area.id));
          markers[area.id] = marker;
        });
      }
    } catch (err) {
      document.getElementById("results").innerHTML =
        `<div class="empty-state">Can't reach the WildCast API at ${apiBase()}.<br/>Start the backend (see README) or fix the API base URL below.</div>`;
    }
  }

  async function selectArea(areaId) {
    state.areaId = areaId;
    areaSelect.value = areaId;
    await renderPredictions();
  }

  areaSelect.addEventListener("change", () => {
    if (areaSelect.value) selectArea(areaSelect.value);
  });

  async function renderPredictions() {
    if (!state.areaId) return;
    const area = state.areas.find((a) => a.id === state.areaId);
    const date = dateInput.value;
    const resultsEl = document.getElementById("results");
    resultsEl.innerHTML = `<div class="empty-state">Loading forecast for ${area.name}...</div>`;

    const res = await fetch(`${apiBase()}/api/predict?area_id=${state.areaId}&date=${date}`);
    if (!res.ok) {
      resultsEl.innerHTML = `<div class="empty-state">No forecast available for this area/date yet.</div>`;
      return;
    }
    const data = await res.json();

    const rows = data.predictions
      .map(
        (p, i) => `
      <div class="species-row" data-species="${p.scientific_name}" data-idx="${i}">
        <div class="top-line">
          <div>
            <div class="name">${p.common_name}</div>
            <div class="sci">${p.scientific_name}</div>
          </div>
          <div class="pct">${Math.round(p.probability * 100)}%</div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${(p.probability * 100).toFixed(0)}%"></div></div>
        <span class="badge ${p.confidence}">${p.confidence} confidence &middot; ${p.training_records} records</span>
        ${p.factors && p.factors.length ? `<ul class="factors">${p.factors.map((f) => `<li>${f}</li>`).join("")}</ul>` : ""}
        <div class="window-chart" id="window-${i}"></div>
      </div>`
      )
      .join("");

    resultsEl.innerHTML = `
      <p class="area-name">${area.name}</p>
      <p class="area-meta">${AREA_TYPE_LABELS[area.type] || "National park"} &middot; ${date}</p>
      ${rows}
      <p class="hint">Click a species to see its best months to visit.</p>
    `;

    resultsEl.querySelectorAll(".species-row").forEach((row) => {
      row.addEventListener("click", () => toggleWindow(row));
    });
  }

  async function toggleWindow(row) {
    const idx = row.dataset.idx;
    const chartEl = document.getElementById(`window-${idx}`);
    const isOpen = chartEl.classList.contains("open");
    row.parentElement.querySelectorAll(".window-chart.open").forEach((el) => el.classList.remove("open"));
    if (isOpen) return;

    chartEl.classList.add("open");
    if (chartEl.dataset.loaded) return;
    chartEl.innerHTML = `<div class="hint">Loading year-round window...</div>`;

    const species = row.dataset.species;
    const res = await fetch(`${apiBase()}/api/best-window?area_id=${state.areaId}&species=${encodeURIComponent(species)}`);
    const data = await res.json();
    chartEl.innerHTML = renderSparkline(data.points);
    chartEl.dataset.loaded = "1";
  }

  function renderSparkline(points) {
    const w = 360, h = 120, padL = 28, padB = 18, padT = 8, padR = 8;
    const plotW = w - padL - padR, plotH = h - padT - padB;
    const maxP = Math.max(0.1, ...points.map((p) => p.probability));
    const x = (i) => padL + (i / (points.length - 1)) * plotW;
    const y = (p) => padT + plotH - (p / maxP) * plotH;

    const path = points.map((p, i) => `${i === 0 ? "M" : "L"}${x(i).toFixed(1)},${y(p.probability).toFixed(1)}`).join(" ");
    const gridLines = [0, 0.25, 0.5, 0.75, 1].map((f) => {
      const gy = padT + plotH * (1 - f);
      return `<line class="grid" x1="${padL}" x2="${w - padR}" y1="${gy}" y2="${gy}" />`;
    }).join("");

    const monthTicks = [0, 60, 121, 182, 243, 304].map((doy, i) => {
      const labels = ["Jan", "Mar", "May", "Jul", "Sep", "Nov"];
      const idx = points.findIndex((p) => p.day_of_year >= doy + 1);
      if (idx === -1) return "";
      return `<text class="axis-label" x="${x(idx).toFixed(1)}" y="${h - 4}" text-anchor="middle">${labels[i]}</text>`;
    }).join("");

    const peak = points.reduce((a, b) => (b.probability > a.probability ? b : a), points[0]);

    return `
      <svg viewBox="0 0 ${w} ${h}">
        ${gridLines}
        <path class="line" d="${path}" />
        <circle cx="${x(points.indexOf(peak)).toFixed(1)}" cy="${y(peak.probability).toFixed(1)}" r="3.5" fill="#256abf" />
        ${monthTicks}
      </svg>
      <p class="hint">Best odds around ${new Date(peak.date).toLocaleDateString(undefined, { month: "long", day: "numeric" })} (${Math.round(peak.probability * 100)}%).</p>
    `;
  }

  dateInput.addEventListener("change", renderPredictions);

  loadAreas();
</script>

</body>
</html>
