name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          flake8 --max-line-length=130 --extend-ignore=E501,W503,E127 app scripts tests

      # The test suite needs a trained model + cached data to exercise the
      # prediction service and API end to end -- generate the offline
      # synthetic demo dataset for that (see scripts/generate_sample_fixtures.py's
      # docstring: never used for real predictions, only for testing and demos).
      - name: Generate offline demo data + train
        run: |
          python -m scripts.generate_sample_fixtures
          python -m app.ml.train

      - name: Run tests
        run: python -m unittest discover -s tests -v

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t wildcast-backend .
      - name: Build frontend image
        run: docker build -f docker/Dockerfile.frontend -t wildcast-frontend .
